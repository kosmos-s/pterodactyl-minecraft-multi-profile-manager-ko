name: Test generated Egg
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y jq unzip
      - name: Check generated Egg
        run: npm run check
      - name: Check shell syntax
        run: |
          sh -n src/profile-launcher.sh
          sh -n src/install.sh
      - name: Test generated launcher and installer
        run: npm test
  runtime-yolk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Test launcher in the actual Java 25 yolk without adding unzip
        run: |
          node_bin="$(dirname "$(command -v node)")"
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD:/workspace" -v "$node_bin:/node:ro" -w /workspace \
            -e JAVA_HOME=/opt/java/openjdk \
            -e PATH=/node:/opt/java/openjdk/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            --entrypoint /bin/sh ghcr.io/pterodactyl/yolks:java_25 \
            -c 'command -v jar; node --test tests/launcher.test.cjs tests/jvm.test.cjs tests/review-regressions.test.cjs'
  installer-alpine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Test installer in the actual Alpine installer image
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace \
            --entrypoint /bin/sh ghcr.io/pterodactyl/installers:alpine \
            -c 'apk add --no-cache nodejs && node --test tests/installer.test.cjs'
